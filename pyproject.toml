[project]
name = "mega-nemo"
version = "0.1.0"
description = "Run keystone + metaswarm + graphify inside a NemoClaw langchain-deepagents (dcode) sandbox, with triangular git workflows back to every source repo."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.15.0",
    "rich>=13.9.0",
    "pyyaml>=6.0.2",
]

[project.scripts]
mega = "mega_nemo.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mega_nemo"]

[tool.ruff]
# Typer help strings and rich markup push past 100 without gaining clarity
# from being wrapped.
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
